<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WEI — Planning des shifts</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#0A1119; --panel:#111C27; --panel-2:#16232F; --line:#22333F;
    --txt:#EAF2F7; --dim:#8098A8; --dim2:#5E7484;
    --live:#57E08A; --soon:#FFB000; --done:#5E7484; --alert:#FF6B5E;
    --c1:#FFB000; --c2:#FF7A6B; --c3:#5FD8EE;
    --font:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg)}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{background:var(--bg);color:var(--txt);font-family:var(--font);font-size:17px;line-height:1.45;
       -webkit-text-size-adjust:100%;
       padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .wrap{max-width:620px;margin:0 auto;padding:14px 14px 96px}
  body[data-mode="admin"] .wrap{max-width:620px;padding:16px 16px 40px}
  @media(min-width:1000px){
    body[data-mode="admin"] .wrap{max-width:1520px;padding:20px 28px 40px}
  }

  h1,h2,h3{margin:0;letter-spacing:-.02em}
  button{font-family:inherit}
  [hidden]{display:none !important}

  /* barre haute */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;
       border-bottom:2px solid var(--line);padding-bottom:12px;margin-bottom:18px}
  .top h1{font-size:1.15rem;font-weight:800}
  .top .sub{color:var(--dim);font-size:.8rem;font-weight:600}
  .lnk{background:none;border:none;color:var(--dim);font-size:.85rem;font-weight:700;
       cursor:pointer;padding:8px;border-radius:8px}
  .lnk:active{color:var(--txt)}

  .btn{display:block;width:100%;padding:16px;margin-top:10px;background:none;
       border:2px solid var(--line);border-radius:13px;color:var(--txt);
       font-size:1rem;font-weight:700;cursor:pointer;text-align:left}
  .btn:active{background:var(--panel)}
  .btn.ghost{color:var(--dim);text-align:center}
  .btn.go{border-color:var(--c1);color:var(--c1);text-align:center}
  .btn:focus-visible,.lnk:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
  .row2{display:flex;gap:10px;flex-wrap:wrap}
  .row2 .btn{width:auto;flex:1;min-width:140px;text-align:center}

  input,textarea,select{width:100%;padding:13px 15px;background:var(--panel-2);
       border:2px solid var(--line);border-radius:12px;color:var(--txt);
       font-family:inherit;font-size:1rem;font-weight:600}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--c1)}
  textarea{min-height:88px;font-weight:500;line-height:1.5}
  label{display:block;color:var(--dim);font-size:.78rem;font-weight:800;
        letter-spacing:.04em;text-transform:uppercase;margin:14px 0 6px}

  /* choix identité */
  .lead{font-size:1.5rem;font-weight:800;margin:6px 0 4px}
  .lead+p{color:var(--dim);margin:0 0 18px}
  .bdegrid{display:grid;gap:10px;grid-template-columns:1fr}
  @media(min-width:620px){.bdegrid{grid-template-columns:repeat(3,1fr)}}
  .bdecard{padding:20px 16px;border:2px solid var(--line);border-left-width:10px;
           border-radius:14px;background:var(--panel);cursor:pointer;color:var(--txt);
           font-size:1.15rem;font-weight:800;text-align:left}
  .bdecard span{display:block;color:var(--dim);font-size:.82rem;font-weight:600;margin-top:2px}
  .bdecard:active{background:var(--panel-2)}

  .people{display:grid;gap:9px;grid-template-columns:1fr;margin-top:12px}
  @media(min-width:620px){.people{grid-template-columns:1fr 1fr}}
  @media(min-width:1000px){.people{grid-template-columns:repeat(3,1fr)}}
  .pbtn{display:flex;align-items:center;gap:12px;padding:16px;min-height:58px;
        background:var(--panel);border:2px solid var(--line);border-radius:13px;
        color:var(--txt);font-size:1.1rem;font-weight:700;text-align:left;cursor:pointer}
  .pbtn:active{background:var(--panel-2)}
  .pip{width:11px;height:11px;border-radius:50%;flex:0 0 auto}

  /* onglets jours */
  .days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin-bottom:6px}
  .day{flex:0 0 auto;padding:11px 15px;border:2px solid var(--line);border-radius:11px;
       background:none;color:var(--dim);font-size:.92rem;font-weight:800;cursor:pointer;white-space:nowrap}
  .day.on{border-color:var(--c1);color:var(--c1);background:#1C1608}
  .day .tag{display:block;font-size:.68rem;font-weight:700;color:var(--dim2);letter-spacing:.06em}
  .day.on .tag{color:var(--c1);opacity:.75}

  /* cartes de shift */
  .card{display:block;width:100%;text-align:left;background:var(--panel);
        border:2px solid var(--line);border-left-width:10px;border-radius:16px;
        padding:16px;margin-bottom:12px;color:var(--txt);cursor:pointer}
  .card:active{background:var(--panel-2)}
  .card .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .pill{font-size:.7rem;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:999px;
        border:1.5px solid var(--dim2);color:var(--dim)}
  .pill.live{border-color:var(--live);color:#06210F;background:var(--live)}
  .pill.soon{border-color:var(--soon);color:var(--soon)}
  .pill.done{opacity:.6}
  .card h3{font-size:1.2rem;font-weight:800;margin-bottom:4px}
  .hours{font-size:2.05rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
         line-height:1.1;margin:4px 0 6px}
  .hours .ar{color:var(--dim2);font-weight:400}
  .meta{color:var(--dim);font-size:.9rem}
  .more{color:var(--c1);font-size:.85rem;font-weight:800;margin-top:10px}

  .none{border:2px dashed var(--line);border-radius:16px;padding:26px 20px;text-align:center;color:var(--dim)}
  .none b{display:block;color:var(--txt);font-size:1.15rem;margin-bottom:6px}

  /* fiche de poste */
  .fh{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;margin:6px 0 2px}
  .fsec{margin-top:22px}
  .fsec h4{margin:0 0 8px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  .fsec p{margin:0;font-size:1.05rem}
  .fsec ul{margin:0;padding-left:20px}
  .fsec li{margin-bottom:7px}
  .team{display:flex;flex-wrap:wrap;gap:8px}
  .tm{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:11px;
      background:var(--panel-2);border:2px solid var(--line);font-size:.95rem;font-weight:700}
  .quota{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .qz{font-size:.85rem;font-weight:700;padding:7px 11px;border-radius:10px;
      background:var(--panel-2);border:2px solid var(--line)}
  .qz.ko{border-color:var(--alert);color:var(--alert)}

  /* admin */
  .adm{border:2px solid var(--line);border-radius:16px;background:var(--panel);padding:14px;margin-bottom:12px}
  .adm .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .adm h3{font-size:1.05rem;font-weight:800}
  .adm .h{color:var(--dim);font-size:.88rem;font-weight:700;font-variant-numeric:tabular-nums}
  .mini{background:none;border:2px solid var(--line);border-radius:9px;color:var(--dim);
        font-size:.78rem;font-weight:800;padding:7px 11px;cursor:pointer;margin:8px 6px 0 0}
  .mini:active{color:var(--txt);background:var(--panel-2)}
  .mini.warn:active{border-color:var(--alert);color:var(--alert)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:9px 13px;
        border-radius:11px;background:var(--panel-2);border:2px solid var(--line);
        color:var(--dim);font-size:.95rem;font-weight:700;cursor:pointer}
  .chip.on{border-color:var(--live);color:var(--txt);background:#122A1C}
  .chip .mk{font-size:.9rem;color:var(--live)}
  .grp{margin-top:14px}
  .grp .gt{font-size:.78rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
  .fld{display:grid;gap:10px;grid-template-columns:1fr 1fr}
  .warnbox{border:2px solid var(--alert);background:#1D1416;border-radius:13px;padding:12px 14px;
           margin-bottom:14px;font-size:.92rem}
  .okbox{border:2px solid var(--live);background:#0F2117;border-radius:13px;padding:12px 14px;
         margin-bottom:14px;font-size:.92rem}
  .demo{border:2px dashed var(--soon);border-radius:13px;padding:11px 14px;margin-bottom:16px;
        color:var(--soon);font-size:.85rem;font-weight:700}
  code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em}
  /* ---------- participant : pensé pour le pouce ---------- */
  .days{position:sticky;top:0;z-index:6;background:var(--bg);scroll-snap-type:x proximity;
        padding-top:6px;margin:0 -14px 8px;padding-left:14px;padding-right:14px}
  .days .day{scroll-snap-align:start;min-height:56px}
  .hero{display:block;width:100%;text-align:left;border-radius:16px;padding:15px 16px;margin-bottom:14px;
        border:2px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer}
  .hero.on{border-color:var(--live);background:#0F2117}
  .hero .k{font-size:.7rem;font-weight:800;letter-spacing:.08em;color:var(--dim)}
  .hero.on .k{color:var(--live)}
  .hero .v{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;margin-top:3px}
  .hero .w{color:var(--dim);font-size:.95rem;margin-top:2px}
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 14px;
        padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
        background:linear-gradient(to top,var(--bg) 62%,rgba(10,17,25,0))}
  .dockin{max-width:620px;margin:0 auto;display:flex;gap:8px}
  .dbtn{flex:1;min-height:52px;padding:13px;border-radius:13px;border:2px solid var(--line);
        background:var(--panel);color:var(--txt);font-size:.95rem;font-weight:800;cursor:pointer}
  .dbtn.alt{flex:0 0 auto;color:var(--dim);background:none}
  .dbtn:active{background:var(--panel-2)}
  body[data-mode="user"] .card{padding:18px 16px}
  body[data-mode="user"] .hours{font-size:clamp(2.4rem,12vw,3.1rem)}
  body[data-mode="user"] .pbtn{min-height:64px;font-size:1.15rem}
  body[data-mode="user"] .bdecard{min-height:76px}
  body[data-mode="user"] .fsec p,body[data-mode="user"] .fsec li{font-size:1.08rem}
  .sticky-back{position:sticky;top:0;z-index:6;background:var(--bg);padding:6px 0 8px;margin:0}

  /* ---------- admin : pensé pour un écran large ---------- */
  .pcnote{display:none;border:2px dashed var(--line);border-radius:12px;padding:10px 13px;
          margin-bottom:14px;color:var(--dim);font-size:.85rem;font-weight:700}
  @media(max-width:760px){ body[data-mode="admin"] .pcnote{display:block} }
  .agrid{display:grid;gap:12px;grid-template-columns:1fr}
  .ecols{display:grid;gap:14px;grid-template-columns:1fr}
  .rgrid{display:grid;gap:12px;grid-template-columns:1fr}
  .abar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
  .abar .days{position:static;margin:0;padding:0;flex:1}
  .abar .btn{width:auto;margin:0;padding:13px 18px;white-space:nowrap}
  @media(min-width:1000px){
    .agrid{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
    .ecols{grid-template-columns:minmax(320px,.85fr) minmax(340px,1fr) minmax(360px,1.15fr);
           align-items:start}
    .rgrid{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
    body[data-mode="admin"] .adm{margin-bottom:0}
    body[data-mode="admin"] .top{position:sticky;top:0;background:var(--bg);z-index:8;
                                 padding-top:6px;margin-bottom:14px}
    .ecol{position:sticky;top:78px}
    .ecol.scroll{position:static}
    .chips{max-height:none}
    .adm .chip{min-height:38px;padding:7px 11px;font-size:.9rem}
  }
  @media(max-width:430px){
    .top h1{font-size:1.02rem}
    .top .sub{font-size:.72rem}
    .sync{padding:5px 7px} .sync #syncT{display:none}
    .ico{padding:8px 9px;font-size:.72rem}
    .lnk{padding:8px 4px;font-size:.78rem}
  }
  .ico{background:none;border:2px solid var(--line);border-radius:10px;color:var(--dim);
       font-size:.76rem;font-weight:800;letter-spacing:.04em;padding:8px 10px;cursor:pointer}
  .ico:active{color:var(--txt);background:var(--panel)}
  .ico.sos{border-color:#4A2326;color:var(--alert)}
  .ico:focus-visible{outline:3px solid var(--c1);outline-offset:2px}

  .sos-big{border:2px solid var(--alert);border-radius:16px;background:#170F11;padding:16px;margin:0 0 16px}
  .sos-big h3{font-size:.76rem;letter-spacing:.1em;color:var(--alert);margin-bottom:10px}
  .tel{display:flex;align-items:center;justify-content:space-between;gap:12px;
       padding:14px 15px;margin-bottom:8px;border-radius:12px;background:var(--panel);
       border:2px solid var(--line);text-decoration:none;color:var(--txt);min-height:56px}
  .tel b{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tel span{font-size:.92rem;color:var(--dim);font-weight:700}
  .tel.first{border-color:var(--alert)}
  .tel.first b{color:var(--alert);font-size:1.6rem}
  .canaux{display:grid;gap:6px;margin-top:12px}
  .can{display:flex;gap:10px;font-size:.92rem}
  .can b{color:var(--c1);font-weight:800;min-width:66px}
  .csg{margin:12px 0 0;font-size:.92rem;color:var(--dim)}
  .sos-mini{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0;padding-top:12px;
            border-top:1px solid var(--line)}
  .sos-mini a{text-decoration:none;color:var(--dim);font-size:.82rem;font-weight:700;
              border:1.5px solid var(--line);border-radius:9px;padding:7px 10px}
  .sos-mini a b{color:var(--alert)}

  .planbox{border:2px solid var(--line);border-radius:14px;background:var(--panel-2);
           overflow:auto;-webkit-overflow-scrolling:touch;padding:8px;margin-top:10px}
  .planbox img,.planbox svg{display:block;max-width:none;height:auto}
  .zoom{display:flex;gap:8px;margin-top:10px;align-items:center}
  .zoom button{min-width:52px;min-height:46px;border:2px solid var(--line);border-radius:11px;
               background:var(--panel);color:var(--txt);font-size:1.1rem;font-weight:800;cursor:pointer}
  .zoom .lvl{color:var(--dim);font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums}
  .snote{margin-top:10px;padding:9px 12px;border-radius:10px;border-left:4px solid var(--c1);
         background:#1C1608;color:var(--txt);font-size:.88rem;font-weight:600}
  .snote.big{font-size:1rem;margin:16px 0 0}
  .grh{grid-column:1 / -1;display:flex;align-items:baseline;gap:10px;margin:14px 0 2px;
       font-size:.8rem;font-weight:800;letter-spacing:.06em;color:var(--dim)}
  .grh b{color:var(--txt);font-size:1rem;letter-spacing:0}
  .grh:first-child{margin-top:0}
  .adm .code{color:var(--dim2);font-size:.75rem;font-weight:800;letter-spacing:.05em;margin-right:6px}
  .pill.resp{border-color:var(--alert);color:var(--alert)}
  .tm.rsp{border-color:var(--alert)}
  .tm em{font-style:normal;color:var(--alert);font-size:.78rem;font-weight:800}
  .tg{flex:0 0 auto;height:34px;padding:0 10px;border-radius:9px;border:2px solid var(--line);
      background:none;color:var(--dim2);font-size:.72rem;font-weight:800;letter-spacing:.04em;cursor:pointer}
  .tg.on{border-color:var(--alert);color:var(--alert)}
  .tg.off{border-color:var(--line);color:var(--dim2);text-decoration:line-through}
  .opt{display:flex;gap:12px;align-items:flex-start;padding:12px;margin:8px 0 0;border-radius:12px;
       border:2px solid var(--line);background:var(--panel-2);cursor:pointer;
       text-transform:none;letter-spacing:0;font-size:.92rem;font-weight:500;color:var(--txt)}
  .opt input{width:auto;margin-top:3px;accent-color:var(--c1)}
  .opt:has(input:checked){border-color:var(--c1)}
  .mems{display:grid;gap:6px;margin-top:10px}
  .mem{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;border-radius:11px;
       background:var(--panel-2);border:2px solid var(--line)}
  .mem .mn{flex:1;font-weight:700;font-size:.95rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mem .mc{color:var(--dim2);font-size:.8rem;font-weight:700;white-space:nowrap}
  .mem .mc.on{color:var(--dim)}
  .mx{flex:0 0 auto;width:38px;height:38px;border-radius:9px;border:2px solid transparent;
      background:none;color:var(--dim);font-size:1rem;font-weight:800;cursor:pointer}
  .mx:hover,.mx:focus-visible{border-color:var(--alert);color:var(--alert);outline:none}
  .toast{position:fixed;left:50%;transform:translateX(-50%);z-index:30;
         bottom:calc(18px + env(safe-area-inset-bottom,0px));
         display:flex;align-items:center;gap:14px;max-width:calc(100% - 28px);
         padding:12px 12px 12px 18px;border-radius:14px;background:#1B2A36;
         border:2px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.5);font-weight:700;font-size:.92rem}
  .toast button{border:2px solid var(--c1);background:none;color:var(--c1);border-radius:10px;
                padding:9px 14px;font-weight:800;cursor:pointer;white-space:nowrap}
  .sync{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:800;
        letter-spacing:.04em;color:var(--dim);padding:6px 10px;border:1.5px solid var(--line);
        border-radius:999px;white-space:nowrap}
  .sync .sdot{width:8px;height:8px;border-radius:50%;background:var(--dim2)}
  .sync.ok{color:var(--live);border-color:#1E3D2B} .sync.ok .sdot{background:var(--live)}
  .sync.ko{color:var(--alert);border-color:#3A1F20} .sync.ko .sdot{background:var(--alert)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1 id="topT">WEI — Shifts</h1>
      <div class="sub" id="topS"></div>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <span id="sync" class="sync" hidden><span class="sdot"></span><span id="syncT"></span></span>
      <button class="ico" id="topP" title="Plan du camping">Plan</button>
      <button class="ico sos" id="topU" title="Numéros d'urgence">SOS</button>
      <button class="lnk" id="topA">Admin</button>
    </div>
  </div>
  <div id="app"></div>
</div>
<div class="dock" id="dock" hidden><div class="dockin" id="dockin"></div></div>
<div class="toast" id="toast" hidden role="status"><span id="toastT"></span><button id="toastU">Annuler</button></div>

<script src="config.js"></script>

<script id="planSvg" type="text/plain">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520" font-family="Helvetica,Arial,sans-serif">
  <rect width="700" height="520" fill="#0E1922"/>
  <path d="M0 400 Q200 370 380 400 T700 380 L700 520 L0 520Z" fill="#12241B"/>
  <path d="M40 0 L40 520" stroke="#2B3D49" stroke-width="26" stroke-dasharray="18 14"/>
  <text x="10" y="270" fill="#6E8493" font-size="12" transform="rotate(-90 14,270)">Route d'accès</text>
  <rect x="70" y="40" width="150" height="90" rx="10" fill="#16232F" stroke="#3A5060" stroke-width="2"/>
  <text x="82" y="70" fill="#EAF2F7" font-size="15" font-weight="bold">Parking</text>
  <text x="82" y="90" fill="#8098A8" font-size="12">Dépose des bus</text>
  <text x="82" y="110" fill="#8098A8" font-size="12">Point de rassemblement</text>
  <rect x="270" y="60" width="230" height="130" rx="12" fill="#1C1608" stroke="#FFB000" stroke-width="3"/>
  <text x="290" y="95" fill="#FFB000" font-size="19" font-weight="bold">Chapiteau</text>
  <text x="290" y="120" fill="#C9A24B" font-size="13">Bar, repas, soirées</text>
  <text x="290" y="142" fill="#C9A24B" font-size="13">Canal 3</text>
  <rect x="545" y="60" width="115" height="75" rx="10" fill="#1D1416" stroke="#FF6B5E" stroke-width="3"/>
  <text x="560" y="90" fill="#FF6B5E" font-size="15" font-weight="bold">PC orga</text>
  <text x="560" y="112" fill="#D08A84" font-size="12">Soins · 24h/24</text>

      return {id:"j" + (i+1), nom:cap(JOURS_FR[d.getDay()]), date:iso(d)};
    });
    return s;
  }
  function charger(){
    if(CONNECTE) return seedData();          // l'état fait autorité côté serveur
    var neuf = seedData();
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var s = JSON.parse(raw);
        // une sauvegarde locale ne vaut que pour la version des données qui l'a produite :
        // quand la page embarque une nouvelle révision, elle l'emporte
        if(s && s.shifts && s.revision === neuf.revision) return s;
      }
    }catch(e){}
    return neuf;
  }
  function sauver(){
    if(CONNECTE){
      if(!remote) return;
      clearTimeout(tmr);
      tmr = setTimeout(function(){ remote.push(state); }, 500);   // une écriture par pause de frappe
      return;
    }
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }

  /* pont avec la couche de synchronisation (voir le module en bas de page) */
  function badge(cls, txt){
    var b = document.getElementById("sync");
    if(!b) return;
    b.hidden = false;
    b.className = "sync" + (cls ? " " + cls : "");
    document.getElementById("syncT").textContent = txt;
  }
  function saisieEnCours(){
    var a = document.activeElement;
    return !!(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA"));
  }
  window.WEI = {
    connect: function(api){ remote = api; },
    seedRemote: function(){ if(remote) remote.push(state); },
    receive: function(json){
      var s;
      try{ s = JSON.parse(json); }catch(e){ return; }
      if(!s || !s.shifts || !s.people) return;
      if(saisieEnCours()){                    // ne pas effacer une saisie en cours
        attente = json;
        clearTimeout(attenteT);
        attenteT = setTimeout(function(){
          var j = attente; attente = null;
          if(j) window.WEI.receive(j);
        }, 2500);
        return;
      }
      attente = null;
      state = s;
      defauts();
      render();
    },
    statut: function(code, info){
      if(code === "ok") badge("ok", "EN DIRECT");
      else if(code === "ko") badge("ko", "HORS LIGNE" + (info ? " · " + info : ""));
      else badge("", "LOCAL");
    }
  };
  function memo(k, v){
    try{ if(v === undefined) return localStorage.getItem(KEY + ":" + k);
         localStorage.setItem(KEY + ":" + k, v); }catch(e){ return null; }
  }

  /* ---------- utilitaires ---------- */
  function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
  function iso(d){
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function el(html){ var d = document.createElement("div"); d.innerHTML = html; return d.firstElementChild; }
  function uid(p){ return p + Math.random().toString(36).slice(2,8); }
  function empreinte(s){
    var v = 5381;
    for(var i=0;i<s.length;i++){ v = ((v<<5) + v + s.charCodeAt(i)) >>> 0; }
    return v;
  }
  function defauts(){
    if(!state.urgences) state.urgences = {numeros:[], canaux:[], consigne:""};
    if(!state.urgences.numeros) state.urgences.numeros = [];
    if(!state.urgences.canaux) state.urgences.canaux = [];
    if(!state.plan) state.plan = {src:"", legende:""};
  }
  function telLien(t){ return "tel:" + String(t).replace(/[^+0-9]/g,""); }
  function telAff(t){
    var v = String(t).replace(/\s/g,"");
    return /^0[0-9]{9}$/.test(v) ? v.replace(/(..)(?=.)/g,"$1 ").trim() : t;
  }

  /* --- bloc urgences, grand format --- */
  function sosGrand(){
    var u = state.urgences;
    if(!u.numeros.length && !u.canaux.length) return null;
    var d = el('<div class="sos-big"><h3>EN CAS D\'URGENCE</h3></div>');
    u.numeros.forEach(function(n, i){
      d.appendChild(el('<a class="tel' + (i === 0 ? ' first' : '') + '" href="' + telLien(n.tel) + '">' +
        '<span>' + esc(n.quoi) + '</span><b>' + esc(telAff(n.tel)) + '</b></a>'));
    });
    if(u.canaux.length){
      var c = el('<div class="canaux"></div>');
      u.canaux.forEach(function(k){
        c.appendChild(el('<div class="can"><b>' + esc(k.quoi) + '</b><span>' + esc(k.role) + '</span></div>'));
      });
      d.appendChild(c);
    }
    if(u.consigne) d.appendChild(el('<p class="csg">' + esc(u.consigne) + '</p>'));
    return d;
  }

  /* --- rappel discret en bas des autres pages --- */
  function sosPetit(){
    var u = state.urgences;
    if(!u.numeros.length) return null;
    var d = el('<div class="sos-mini"></div>');
    u.numeros.slice(0,2).forEach(function(n){
      d.appendChild(el('<a href="' + telLien(n.tel) + '">' + esc(n.quoi.split(" —")[0]) +
        ' <b>' + esc(telAff(n.tel)) + '</b></a>'));
    });
    var p = el('<a href="#">Tous les numéros</a>');
    p.addEventListener("click", function(e){ e.preventDefault(); go("sos"); });
    d.appendChild(p);
    return d;
  }

  function jourDe(id){
    for(var i=0;i<state.jours.length;i++) if(state.jours[i].id === id) return state.jours[i];
    return null;
  }
  function bdeDe(id){
    for(var i=0;i<state.bdes.length;i++) if(state.bdes[i].id === id) return state.bdes[i];
    return {id:id, nom:id, court:"?", couleur:"#8098A8"};
  }
  function pers(id){
    for(var i=0;i<state.people.length;i++) if(state.people[i].id === id) return state.people[i];
    return null;
  }
  function shift(id){
    for(var i=0;i<state.shifts.length;i++) if(state.shifts[i].id === id) return state.shifts[i];
    return null;
  }
  function dateLabel(j){
    var p = j.date.split("-");
    return +p[2] + " " + MOIS_FR[+p[1]-1];
  }
  function coupure(){ return state.coupure == null ? 6 : state.coupure; }
  function debutDe(s){
    var j = jourDe(s.jour); if(!j) return null;
    var p = j.date.split("-"), h = s.debut.split(":");
    var d = new Date(+p[0], +p[1]-1, +p[2], +h[0], +h[1], 0, 0);
    if(+h[0] < coupure()) d.setDate(d.getDate() + 1);   // 02h00 le vendredi = la nuit de vendredi à samedi
    return d;
  }
  /* date « festival » : jusqu'à 6 h du matin, on est encore la veille */
  function dateFestival(){
    var d = new Date(Date.now() - coupure()*3600000);
    return iso(d);
  }
  function finDe(s){
    var d = debutDe(s); if(!d) return null;
    var h = s.fin.split(":"), f = new Date(d.getTime());
    f.setHours(+h[0], +h[1], 0, 0);
    if(f <= d) f.setDate(f.getDate() + 1);   // shift qui passe minuit
    return f;
  }
  function statut(s){
    var d = debutDe(s), f = finDe(s), now = new Date();
    if(!d) return {c:"", l:""};
    if(now >= d && now < f) return {c:"live", l:"EN COURS"};
    if(now >= f) return {c:"done", l:"TERMINÉ"};
    var min = Math.round((d - now)/60000);
    if(min <= 90) return {c:"soon", l:"DANS " + (min < 60 ? min + " MIN" : Math.round(min/60) + " H")};
    return {c:"", l:"À VENIR"};
  }
  function triShifts(a,b){
    var da = debutDe(a), db2 = debutDe(b);
    return (da && db2) ? da - db2 : 0;
  }
  function shiftsDuJour(jid){
    return state.shifts.filter(function(s){ return s.jour === jid; }).sort(triShifts);
  }
  function respsDe(s){ return s.resps || []; }
  function estResp(s, pid){ return respsDe(s).indexOf(pid) > -1; }
  function estSur(s, pid){ return s.equipe.indexOf(pid) > -1 || estResp(s, pid); }
  function mesShifts(pid){
    return state.shifts.filter(function(s){ return s.tous || estSur(s, pid); }).sort(triShifts);
  }
  function mesAffectations(pid){   // hors moments collectifs, pour les compteurs
    return state.shifts.filter(function(s){ return !s.tous && estSur(s, pid); });
  }
  function court(nom){             // « Hugo DELEMOTTE » -> « Hugo D. »
    var t = String(nom).split(" ");
    return t.length > 1 ? t[0] + " " + t[1].charAt(0) + "." : nom;
  }
  function jourAujourdhui(){
    var t = dateFestival();
    for(var i=0;i<state.jours.length;i++) if(state.jours[i].date === t) return state.jours[i].id;
    return null;
  }
  function compte(s, bid){
    return s.equipe.filter(function(pid){ var p = pers(pid); return p && p.bde === bid; }).length;
  }
  function manque(s){
    if(s.tous) return 0;
    if(s.total) return Math.max(0, s.total - s.equipe.length);
    var m = 0;
    state.bdes.forEach(function(b){ m += Math.max(0, (s.quotas[b.id]||0) - compte(s, b.id)); });
    return m;
  }
  function pastillesQuota(s){
    if(s.tous) return '<span class="qz">Tous les BDE</span>';
    if(s.total) return '<span class="qz' + (s.equipe.length < s.total ? ' ko' : '') + '">Sans répartition ' +
                       s.equipe.length + '/' + s.total + '</span>';
    return state.bdes.map(function(b){
      var c = compte(s, b.id), n = s.quotas[b.id] || 0;
      return '<span class="qz' + (c < n ? ' ko' : '') + '" style="border-left:4px solid ' + b.couleur +
             '">' + b.court + ' ' + c + '/' + n + '</span>';
    }).join("");
  }

  /* fiches communes à tous les shifts d'un même poste */
  function cle(nom){
    return String(nom).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
  }
  function ficheDe(s){
    state.fiches = state.fiches || {};
    return state.fiches[cle(s.nom)] || s.fiche || {};
  }
  function ficheVide(f){
    return !(f.mission || (f.taches && f.taches.length) || (f.materiel && f.materiel.length) || f.referent);
  }

  /* ---------- rendu ---------- */
  var app = document.getElementById("app");
  var dock = document.getElementById("dock"), dockin = document.getElementById("dockin");
  var topT = document.getElementById("topT"), topS = document.getElementById("topS");
  var topA = document.getElementById("topA");

  function go(n, p){ vue = {n:n, p:p}; render(); window.scrollTo(0,0); }

  function render(){
    var estAdmin = (vue.n === "admin" || vue.n === "edit" || vue.n === "reglages");
    document.body.setAttribute("data-mode", estAdmin ? "admin" : "user");
    topT.textContent = state.event.nom;
    topS.textContent = state.event.lieu;
    topA.textContent = estAdmin ? "Quitter l'admin" : "Admin";
    dock.hidden = true; dockin.innerHTML = "";
    app.innerHTML = "";
    ({pick:vPick, me:vMoi, fiche:vFiche, planning:vPlanning, plan:vPlan, sos:vSos,
      gate:vGate, admin:vAdmin, edit:vEdit, reglages:vReglages}[vue.n] || vPick)();
    if(!estAdmin && vue.n !== "sos" && vue.n !== "pick" && vue.n !== "me"){
      var mini = sosPetit(); if(mini) app.appendChild(mini);
    }
  }

  /* --- choix de l'identité --- */
  function vPick(){
    var bid = vue.p && vue.p.bde;
    if(!bid){
      app.appendChild(el('<h2 class="lead">Ton nom est dans quel BDE ?</h2>'));
      app.appendChild(el('<p>Tu ne le choisis qu\'une fois, la page s\'en souvient ensuite.</p>'));
      var g = el('<div class="bdegrid"></div>');
      state.bdes.forEach(function(b){
        var n = state.people.filter(function(p){ return p.bde === b.id; }).length;
        var c = el('<button class="bdecard" style="border-left-color:' + b.couleur + '">' +
                   esc(b.nom) + '<span>' + n + ' personnes</span></button>');
        c.addEventListener("click", function(){ go("pick", {bde:b.id}); });
        g.appendChild(c);
      });
      app.appendChild(g);
      var pl = el('<button class="btn ghost">Voir le planning général</button>');
      pl.addEventListener("click", function(){ go("planning"); });
      app.appendChild(pl);
      var sg = sosGrand(); if(sg){ app.appendChild(el('<div style="height:20px"></div>')); app.appendChild(sg); }
      return;
    }
    var b = bdeDe(bid);
    app.appendChild(el('<h2 class="lead">' + esc(b.nom) + '</h2>'));
    app.appendChild(el('<p>Touche ton nom.</p>'));
    var f = el('<input type="search" placeholder="Chercher un nom" aria-label="Chercher un nom">');
    app.appendChild(f);
    var list = el('<div class="people"></div>');
    app.appendChild(list);
    function fill(){
      var q = f.value.trim().toUpperCase();
      list.innerHTML = "";
      state.people.filter(function(p){ return p.bde === bid; })
        .sort(function(x,y){ return x.nom.localeCompare(y.nom, "fr"); })
        .forEach(function(p){
          if(q && p.nom.toUpperCase().indexOf(q) === -1) return;
          var btn = el('<button class="pbtn"><span class="pip" style="background:' + b.couleur +
                       '"></span>' + esc(p.nom) + '</button>');
          btn.addEventListener("click", function(){ moi = p.id; memo("moi", p.id); go("me"); });
          list.appendChild(btn);
        });
    }
    f.addEventListener("input", fill); fill();
    var back = el('<button class="btn ghost">Changer de BDE</button>');
    back.addEventListener("click", function(){ go("pick"); });
    app.appendChild(back);
  }

  /* --- ma page --- */
  function vMoi(){
    var p = pers(moi);
    if(!p){ go("pick"); return; }
    var b = bdeDe(p.bde);
    app.appendChild(el('<h2 class="lead">' + esc(p.nom) + '</h2>'));
    app.appendChild(el('<p style="color:' + b.couleur + ';font-weight:700">' + esc(b.nom) + '</p>'));

    var tous = mesShifts(moi);
    var jid = (vue.p && vue.p.jour) || jourAujourdhui() || (state.jours[0] && state.jours[0].id);

    var h = resume(moi);
    if(h) app.appendChild(h);
    var av = avant(); if(av) app.appendChild(av);
    app.appendChild(onglets(jid, function(id){ go("me", {jour:id}); }));

    var duJour = tous.filter(function(s){ return s.jour === jid; });
    if(!duJour.length){
      app.appendChild(el('<div class="none"><b>Aucun shift ce jour-là</b>' +
        (tous.length ? 'Tu as ' + tous.length + ' shift' + (tous.length>1?'s':'') + ' sur le week-end, regarde les autres jours.'
                     : 'Tu n\'es sur aucun shift pour le moment.') + '</div>'));
    } else {
      duJour.forEach(function(s){ app.appendChild(carte(s, true)); });
    }

    var sg = sosGrand();
    if(sg){ app.appendChild(el('<div style="height:8px"></div>')); app.appendChild(sg); }

    dock.hidden = false;
    var pl = el('<button class="dbtn">Planning du jour</button>');
    pl.addEventListener("click", function(){ go("planning", {jour:jid}); });
    var ch = el('<button class="dbtn alt">Pas moi</button>');
    ch.addEventListener("click", function(){ moi = null; memo("moi",""); go("pick"); });
    dockin.appendChild(pl); dockin.appendChild(ch);
  }

  /* bandeau du haut : ce qui se passe maintenant, ou le prochain shift */
  function resume(pid){
    var now = new Date(), enc = null, nxt = null;
    mesShifts(pid).forEach(function(s){
      var d = debutDe(s), f = finDe(s);
      if(!d) return;
      if(now >= d && now < f){ if(!enc) enc = s; }
      else if(d > now && (!nxt || d < debutDe(nxt))) nxt = s;
    });
    if(enc){
      var b = el('<button class="hero on"><span class="k">EN CE MOMENT</span>' +
        '<div class="v">' + esc(enc.nom) + '</div>' +
        '<div class="w">jusqu\'à ' + enc.fin + (enc.lieu ? ' · ' + esc(enc.lieu) : '') + '</div></button>');
      b.addEventListener("click", function(){ go("fiche", {id:enc.id}); });
      return b;
    }
    if(nxt){
      var d = debutDe(nxt), min = Math.round((d - now)/60000), q;
      if(min < 60) q = "dans " + min + " min";
      else if(min < 600) q = "dans " + Math.floor(min/60) + " h " + (min%60 ? (min%60) + " min" : "");
      else { var j = jourDe(nxt.jour); q = (j ? j.nom.toLowerCase() + " " : "") + "à " + nxt.debut; }
      var c = el('<button class="hero"><span class="k">PROCHAIN SHIFT</span>' +
        '<div class="v">' + esc(nxt.nom) + '</div>' +
        '<div class="w">' + q + ' · ' + nxt.debut + ' → ' + nxt.fin +
        (nxt.lieu ? ' · ' + esc(nxt.lieu) : '') + '</div></button>');
      c.addEventListener("click", function(){ go("fiche", {id:nxt.id}); });
      return c;
    }
    return null;
  }

  function onglets(jid, cb){
    var d = el('<div class="days"></div>');
    var today = dateFestival();
    state.jours.forEach(function(j){
      var t = el('<button class="day' + (j.id === jid ? ' on' : '') + '">' +
                 '<span class="tag">' + (j.date === today ? "AUJOURD'HUI" : dateLabel(j)) + '</span>' +
                 esc(j.nom) + '</button>');
      t.addEventListener("click", function(){ cb(j.id); });
      d.appendChild(t);
    });
    return d;
  }

  function avant(){
    if(jourAujourdhui() || !state.jours.length) return null;
    var j = state.jours[0], p = j.date.split("-");
    var d0 = new Date(+p[0], +p[1]-1, +p[2]), now = new Date();
    now.setHours(0,0,0,0);
    var n = Math.round((d0 - now)/86400000);
    if(n < 0) return el('<p class="meta">Le week-end est terminé.</p>');
    return el('<p class="meta">Ça commence ' + (n === 0 ? "aujourd'hui" : n === 1 ? "demain" :
      'dans ' + n + ' jours') + ', le ' + esc(j.nom.toLowerCase()) + ' ' + dateLabel(j) + '.</p>');
  }

  function carte(s, cliquable){
    var st = statut(s), b = null;
    var c = el('<button class="card"></button>');
    if(moi){ var p = pers(moi); if(p) b = bdeDe(p.bde); }
    c.style.borderLeftColor = st.c === "live" ? "var(--live)" : (b ? b.couleur : "var(--line)");
    var jeResp = moi && estResp(s, moi);
    var autres = s.equipe.length + respsDe(s).length - (moi && estSur(s, moi) ? 1 : 0);
    var qui = s.tous ? 'Tous les BDE' :
              (autres > 0 ? 'Avec ' + autres + ' autre' + (autres>1?'s':'') : 'Seul sur ce poste');
    c.innerHTML =
      '<div class="hd"><span class="pill ' + st.c + '">' + st.l + '</span>' +
      (jeResp ? '<span class="pill resp">RESPONSABLE</span>' : '') +
      (s.lieu ? '<span class="meta">' + esc(s.lieu) + '</span>' : '') + '</div>' +
      '<h3>' + esc(s.nom) + '</h3>' +
      '<div class="hours">' + s.debut + ' <span class="ar">→</span> ' + s.fin + '</div>' +
      '<div class="meta">' + qui + '</div>' +
      (s.note ? '<div class="snote">' + esc(s.note) + '</div>' : '') +
      (cliquable ? '<div class="more">Voir la fiche de poste →</div>' : '');
    if(cliquable) c.addEventListener("click", function(){ go("fiche", {id:s.id}); });
    return c;
  }

  /* --- fiche de poste --- */
  function vFiche(){
    var s = shift(vue.p && vue.p.id);
    if(!s){ go("me"); return; }
    var j = jourDe(s.jour), st = statut(s), f = ficheDe(s);
    var back = el('<button class="lnk sticky-back">← Retour</button>');
    back.addEventListener("click", function(){ moi ? go("me", {jour:s.jour}) : go("planning", {jour:s.jour}); });
    app.appendChild(back);
    app.appendChild(el('<h2 class="fh">' + esc(s.nom) + '</h2>'));
    app.appendChild(el('<p class="meta">' + (j ? esc(j.nom) + ' ' + dateLabel(j) : '') +
      ' · ' + s.debut + ' → ' + s.fin + (s.lieu ? ' · ' + esc(s.lieu) : '') + '</p>'));
    app.appendChild(el('<div style="margin-top:10px"><span class="pill ' + st.c + '">' + st.l + '</span></div>'));

    if(s.note) app.appendChild(el('<div class="snote big">' + esc(s.note) + '</div>'));
    if(ficheVide(f)) app.appendChild(el('<div class="fsec"><h4>Fiche de poste</h4>' +
      '<p class="meta">Pas encore rédigée. Demande à ton responsable de shift ce qui est attendu.</p></div>'));
    if(f.mission) app.appendChild(el('<div class="fsec"><h4>Ta mission</h4><p>' + esc(f.mission) + '</p></div>'));
    if(f.taches && f.taches.length)
      app.appendChild(el('<div class="fsec"><h4>Ce que tu fais</h4><ul>' +
        f.taches.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join("") + '</ul></div>'));
    if(f.materiel && f.materiel.length)
      app.appendChild(el('<div class="fsec"><h4>Matériel</h4><ul>' +
        f.materiel.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join("") + '</ul></div>'));
    if(f.referent) app.appendChild(el('<div class="fsec"><h4>En cas de problème</h4><p>' + esc(f.referent) + '</p></div>'));

    if(s.tous){
      app.appendChild(el('<div class="fsec"><h4>Qui</h4><p>Tous les membres des BDE.</p></div>'));
      return;
    }
    if(moi && estResp(s, moi)) app.appendChild(el('<div class="snote big" style="border-left-color:var(--alert)">' +
      'Tu es responsable de ce shift : tu encadres l\'équipe et tu es le relais du PC orga.</div>'));
    var eq = el('<div class="fsec"><h4>L\'équipe du shift</h4><div class="team"></div></div>');
    var box = eq.querySelector(".team");
    respsDe(s).concat(s.equipe).forEach(function(pid, i){
      var p = pers(pid); if(!p) return;
      var b = bdeDe(p.bde), r = i < respsDe(s).length;
      box.appendChild(el('<span class="tm' + (r ? ' rsp' : '') + '"><span class="pip" style="background:' + b.couleur + '"></span>' +
        esc(p.nom) + (pid === moi ? ' (toi)' : '') + (r ? ' <em>resp.</em>' : '') + '</span>'));
    });
    if(!s.equipe.length && !respsDe(s).length) box.appendChild(el('<span class="meta">Personne pour l\'instant.</span>'));
    app.appendChild(eq);
  }

  /* --- planning général --- */
  function vPlanning(){
    var jid = (vue.p && vue.p.jour) || jourAujourdhui() || (state.jours[0] && state.jours[0].id);
    var back = el('<button class="lnk">← Retour</button>');
    back.addEventListener("click", function(){ moi ? go("me", {jour:jid}) : go("pick"); });
    app.appendChild(back);
    app.appendChild(el('<h2 class="lead">Planning du jour</h2>'));
    app.appendChild(onglets(jid, function(id){ go("planning", {jour:id}); }));
    var l = shiftsDuJour(jid);
    if(!l.length){ app.appendChild(el('<div class="none"><b>Rien de prévu</b>Aucun shift ce jour-là.</div>')); return; }
    var dernierCodeP = null;
    l.forEach(function(s){
      if(s.code && s.code !== dernierCodeP){
        dernierCodeP = s.code;
        app.appendChild(el('<div class="grh" style="margin-top:18px"><b>' + s.debut + '</b>' + esc(s.code) + '</div>'));
      }
      var st = statut(s);
      var c = el('<button class="card"></button>');
      c.style.borderLeftColor = st.c === "live" ? "var(--live)" : "var(--line)";
      var nr = respsDe(s).length;
      var noms = respsDe(s).concat(s.equipe).map(function(pid, i){
        var p = pers(pid); if(!p) return "";
        return '<span class="tm' + (i < nr ? ' rsp' : '') + '"><span class="pip" style="background:' + bdeDe(p.bde).couleur + '"></span>' +
               esc(p.nom) + (i < nr ? ' <em>resp.</em>' : '') + '</span>';
      }).join("");
      c.innerHTML = '<div class="hd"><span class="pill ' + st.c + '">' + st.l + '</span>' +
        (s.lieu ? '<span class="meta">' + esc(s.lieu) + '</span>' : '') + '</div>' +
        '<h3>' + esc(s.nom) + '</h3>' +
        '<div class="hours">' + s.debut + ' <span class="ar">→</span> ' + s.fin + '</div>' +
        '<div class="team" style="margin-top:8px">' + (s.tous ? '<span class="meta">Tous les BDE</span>' :
          (noms || '<span class="meta">Personne</span>')) + '</div>' +
        '<div class="more">Voir la fiche de poste →</div>';
      c.addEventListener("click", function(){ go("fiche", {id:s.id}); });
      app.appendChild(c);
    });
  }

  /* --- plan du camping --- */
  var zoom = 1;
  function vPlan(){
    var back = el('<button class="lnk sticky-back">← Retour</button>');
    back.addEventListener("click", retour);
    app.appendChild(back);
    app.appendChild(el('<h2 class="lead">Plan du camping</h2>'));
    if(state.plan.legende) app.appendChild(el('<p class="meta">' + esc(state.plan.legende) + '</p>'));

    var box = el('<div class="planbox"></div>');
    var inner;
    if(state.plan.src){
      inner = el('<img alt="Plan du camping" width="' + (state.plan.w || 700) +
                 '" src="' + esc(state.plan.src) + '">');
      inner.addEventListener("error", function(){
        box.innerHTML = "";
        box.appendChild(el('<p class="meta" style="padding:16px">Le plan n\'a pas pu être chargé. ' +
          'Vérifie le nom du fichier dans l\'admin.</p>'));
      });
    } else {
      inner = el(document.getElementById("planSvg").textContent.trim());
    }
    box.appendChild(inner);
    app.appendChild(box);

    var base = parseFloat(inner.getAttribute("width")) || 700;
    function applique(){
      inner.style.width = Math.round(base * zoom) + "px";
      inner.removeAttribute("height");
      lvl.textContent = Math.round(zoom * 100) + " %";
    }
    var z = el('<div class="zoom"></div>');
    var moins = el('<button aria-label="Dézoomer">−</button>');
    var plus = el('<button aria-label="Zoomer">+</button>');
    var fit = el('<button style="min-width:auto;padding:0 14px;font-size:.85rem">Ajuster</button>');
    var lvl = el('<span class="lvl"></span>');
    moins.addEventListener("click", function(){ zoom = Math.max(0.5, zoom - 0.25); applique(); });
    plus.addEventListener("click", function(){ zoom = Math.min(4, zoom + 0.25); applique(); });
    fit.addEventListener("click", function(){
      zoom = Math.max(0.4, (box.clientWidth - 24) / base); applique();
    });
    z.appendChild(moins); z.appendChild(plus); z.appendChild(fit); z.appendChild(lvl);
    app.appendChild(z);
    app.appendChild(el('<p class="meta" style="margin-top:8px">Tu peux aussi zoomer à deux doigts et ' +
      'faire glisser le plan.</p>'));
    zoom = Math.max(0.4, Math.min(1, (Math.min(window.innerWidth, 620) - 60) / base));
    applique();
  }

  function lignes(v){
    return v.split("\n").map(function(x){ return x.trim(); }).filter(function(x){ return x; });
  }
  function occupe(pid, s){
    var d = debutDe(s), f = finDe(s);
    return state.shifts.some(function(o){
      if(o.id === s.id || o.tous || !estSur(o, pid)) return false;
      var od = debutDe(o), of2 = finDe(o);
      return od < f && d < of2;
    });
  }

  /* --- répartition automatique d'un BDE ---------------------------------
     Tirage au sort sous contraintes, sur les seules places vides :
     - jamais deux créneaux qui se chevauchent (postes de responsable compris) ;
     - charge équilibrée en heures, pas en nombre de shifts ;
     - on évite d'enchaîner deux créneaux sans au moins 30 min de pause ;
     - on évite plus de 3 h d'affilée, et d'enchaîner une fin de nuit (après 2 h)
       avec un créneau du matin (avant 11 h) le même jour ;
     - un responsable n'est pas placé sur un autre poste dans l'heure qui précède
       ou qui suit ses créneaux de responsable : il reste à son poste ;
     - les fins de nuit sont réparties entre tous, mais regroupées sur une seule
       nuit par personne : qui fait la fin de nuit du vendredi est épargné le samedi
       matin et le samedi soir, et inversement ;
     - 120 tirages, on garde le meilleur, puis on rééquilibre en transférant des
       créneaux des plus chargés vers les moins chargés, sans jamais enfreindre
       les règles ci-dessus. Les affectations existantes ne bougent pas, donc le
       bouton complète un planning déjà commencé. */
  var H = 3600000;
  function melange(a){
    for(var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function repartir(bid){
    var pool = state.people.filter(function(p){ return p.bde === bid && !p.horsAuto; });
    var slots = [];
    state.shifts.forEach(function(sh){
      if(sh.tous || sh.total) return;
      var n = Math.max(0, (sh.quotas[bid] || 0) - compte(sh, bid));
      var d = debutDe(sh), f = finDe(sh);
      if(!d) return;
      for(var k = 0; k < n; k++) slots.push({s:sh, d:d.getTime(), f:f.getTime()});
    });
    if(!pool.length || !slots.length) return {places:slots.length, remplies:0};

    var base = {}, chefs = {};
    pool.forEach(function(p){
      chefs[p.id] = state.shifts.filter(function(o){ return estResp(o, p.id); })
        .map(function(o){ return [debutDe(o).getTime() - H, finDe(o).getTime() + H]; });
    });
    pool.forEach(function(p){
      base[p.id] = state.shifts.filter(function(o){ return !o.tous && estSur(o, p.id); })
        .map(function(o){ return [debutDe(o).getTime(), finDe(o).getTime()]; });
    });
    function charge(L){ var m = 0; for(var i=0;i<L.length;i++) m += L[i][1] - L[i][0]; return m / 60000; }
    function bloc(L, d, f){            // durée du bloc continu qui contiendrait [d,f]
      var a = d, b = f, bouge = true;
      while(bouge){
        bouge = false;
        for(var i=0;i<L.length;i++){
          if(L[i][1] >= a && L[i][0] <= b && (L[i][0] < a || L[i][1] > b)){
            a = Math.min(a, L[i][0]); b = Math.max(b, L[i][1]); bouge = true;
          }
        }
      }
      return (b - a) / 60000;
    }
    function heureDe(t){ var x = new Date(t); return x.getHours() + x.getMinutes()/60; }
    function jourDeT(t){ var x = new Date(t); return x.getFullYear()*10000 + x.getMonth()*100 + x.getDate(); }
    function nuitMatin(L, d, f){       // fin de nuit puis matin, ou l'inverse, le même jour
      var hd = heureDe(d), jd = jourDeT(d), pen = 0;
      for(var i=0;i<L.length;i++){
        var ld = L[i][0], lf = L[i][1];
        if(hd >= 6 && hd < 11 && jourDeT(lf) === jd && heureDe(lf) > 2 && heureDe(lf) <= 6 && lf <= d) pen++;
        var hl = heureDe(ld);
        if(hl >= 6 && hl < 11 && jourDeT(f) === jourDeT(ld) && heureDe(f) > 2 && heureDe(f) <= 6 && f <= ld) pen++;
      }
      return pen;
    }
    function chevauche(L, d, f){ for(var i=0;i<L.length;i++) if(L[i][0] < f && d < L[i][1]) return true; return false; }
    var PAUSE = 30 * 60000, NUIT_CONTINUE = !!state.nuitContinue;
    function jonctionOk(t){            // mode « nuit d'un bloc » : on peut enchaîner entre 1 h et 6 h
      if(!NUIT_CONTINUE) return false;
      var h = new Date(t).getHours(); return h >= 1 && h < 6;
    }
    function colles(L, d, f){          // créneaux de L sans vraie pause avant ou après [d,f]
      var n = 0;
      for(var i=0;i<L.length;i++){
        if(L[i][1] <= d && d - L[i][1] < PAUSE){ if(!jonctionOk(d)) n++; }
        else if(f <= L[i][0] && L[i][0] - f < PAUSE){ if(!jonctionOk(f)) n++; }
      }
      return n;
    }
    function nbChaines(L){
      var t = L.slice().sort(function(x, y){ return x[0] - y[0]; }), n = 0;
      for(var i=1;i<t.length;i++)
        if(t[i][0] >= t[i-1][1] && t[i][0] - t[i-1][1] < PAUSE && !jonctionOk(t[i][0])) n++;
      return n;
    }
    function tardif(f){ var h = heureDe(f); return h > 2 && h <= 6; }
    function nbTardifs(L){ var n = 0; for(var i=0;i<L.length;i++) if(tardif(L[i][1])) n++; return n; }
    function nuits(L, f){              // [fins de nuit la même nuit, fins de nuit une autre nuit]
      var j = jourDeT(f), meme = 0, autre = 0;
      for(var i=0;i<L.length;i++) if(tardif(L[i][1])){ if(jourDeT(L[i][1]) === j) meme++; else autre++; }
      return [meme, autre];
    }

    var meilleur = null;
    for(var essai = 0; essai < 40; essai++){
      var iv = {}, pris = {};
      pool.forEach(function(p){ iv[p.id] = base[p.id].slice(); });
      var ordre = melange(slots.slice()).sort(function(x, y){ return x.d - y.d; });
      var aff = [], rates = 0, pen = 0;
      ordre.forEach(function(sl){
        var choix = null, mini = Infinity, cle2 = sl.s.id;
        pool.forEach(function(p){
          if(sl.s.equipe.indexOf(p.id) > -1 || estResp(sl.s, p.id)) return;
          if(pris[cle2 + "|" + p.id]) return;
          var L = iv[p.id];
          if(chevauche(L, sl.d, sl.f)) return;
          if(chevauche(chefs[p.id], sl.d, sl.f)) return;   // reste à son poste de responsable
          var sc = charge(L);
          if(bloc(L, sl.d, sl.f) > 180) sc += 600;
          sc += 700 * colles(L, sl.d, sl.f);
          sc += 450 * nuitMatin(L, sl.d, sl.f);
          if(tardif(sl.f)){
            var nn = nuits(L, sl.f);
            if(nn[1]) sc += 350;           // déjà une fin de nuit l'autre nuit : on épargne
            else if(nn[0]) sc -= 120;      // déjà de nuit ce soir-là : on regroupe
          }
          sc += Math.random() * 50;
          if(sc < mini){ mini = sc; choix = p.id; }
        });
        if(choix === null){ rates++; return; }
        if(bloc(iv[choix], sl.d, sl.f) > 180) pen++;
        pen += nuitMatin(iv[choix], sl.d, sl.f);
        iv[choix].push([sl.d, sl.f]);
        pris[cle2 + "|" + choix] = true;
        aff.push([sl.s, choix, sl.d, sl.f]);
      });
      var ch = pool.map(function(p){ return charge(iv[p.id]); });
      var ecart = Math.max.apply(null, ch) - Math.min.apply(null, ch);
      var deuxNuits = pool.filter(function(p){
        var js = {}; iv[p.id].forEach(function(x){ if(tardif(x[1])) js[jourDeT(x[1])] = 1; });
        return Object.keys(js).length > 1;
      }).length;
      var chaines = 0;
      pool.forEach(function(p){ chaines += nbChaines(iv[p.id]); });
      var score = rates * 1e6 + chaines * 500 + pen * 400 + deuxNuits * 150 + ecart;
      if(!meilleur || score < meilleur.score) meilleur = {score:score, aff:aff, iv:iv, rates:rates, pen:pen, ecart:ecart};
    }

    /* ---- optimisation globale (recuit simulé) ----------------------------
       Point de départ : le meilleur tirage. On propose ensuite des centaines de
       milliers de petites modifications — donner un créneau à quelqu'un d'autre,
       ou échanger deux créneaux entre deux personnes — et on garde celles qui
       améliorent le planning, par ordre de priorité :
         1. pas d'enchaînement sans 30 min de pause,
         2. pas de fin de nuit suivie d'un créneau le matin même,
         3. pas de bloc de plus de 3 h,
         4. le moins possible de monde de nuit les deux nuits,
         5. des heures équilibrées entre tous. */
    var IV = meilleur.iv, A = meilleur.aff, ids = pool.map(function(p){ return p.id; });
    var total = 0; ids.forEach(function(id){ total += charge(IV[id]); });
    var moy = total / ids.length;
    var W_CH = 1000, W_NM = 800, W_BL = 600, W_2N = 350, W_LD = 60;
    function coutP(pid){
      var L = IV[pid], t = L.slice().sort(function(x, y){ return x[0] - y[0]; }), c = 0, i, j;
      for(i = 1; i < t.length; i++){
        var gap = t[i][0] - t[i-1][1];
        if(gap >= 0 && gap < PAUSE && !jonctionOk(t[i][0])) c += W_CH;
      }
      var a = null, b = null;
      for(i = 0; i < t.length; i++){
        if(a !== null && t[i][0] <= b){ b = Math.max(b, t[i][1]); }
        else { if(a !== null && (b - a) > 180*60000) c += W_BL; a = t[i][0]; b = t[i][1]; }
      }
      if(a !== null && (b - a) > 180*60000) c += W_BL;
      var nuitsVues = {}, nb = 0;
      for(i = 0; i < t.length; i++){
        if(!tardif(t[i][1])) continue;
        var jf = jourDeT(t[i][1]);
        if(!nuitsVues[jf]){ nuitsVues[jf] = 1; nb++; }
        for(j = 0; j < t.length; j++){
          var hd = heureDe(t[j][0]);
          if(hd >= 6 && hd < 11 && jourDeT(t[j][0]) === jf && t[j][0] >= t[i][1]) c += W_NM;
        }
      }
      if(nb > 1) c += W_2N;
      var dev = (charge(L) - moy) / 60;
      return c + W_LD * dev * dev;
    }
    function retire(L, d, f){ for(var m = 0; m < L.length; m++) if(L[m][0] === d && L[m][1] === f){ L.splice(m, 1); return; } }
    var occ = {};
    A.forEach(function(a){ occ[a[0].id + "|" + a[1]] = 1; });
    function dispo(pid, a){            // contraintes dures pour recevoir le créneau a
      if(occ[a[0].id + "|" + pid] || a[0].equipe.indexOf(pid) > -1 || estResp(a[0], pid)) return false;
      return !chevauche(IV[pid], a[2], a[3]) && !chevauche(chefs[pid], a[2], a[3]);
    }
    var C = {}, cout = 0;
    ids.forEach(function(id){ C[id] = coutP(id); cout += C[id]; });
    var meilleurCout = cout, meilleursProprios = A.map(function(a){ return a[1]; });
    var N = 160000, T0 = 500, T1 = 1, T = T0, k = Math.pow(T1 / T0, 1 / N);
    for(var it = 0; it < N && A.length && ids.length > 1; it++, T *= k){
      var a1 = A[Math.floor(Math.random() * A.length)], P = a1[1], delta, cP, cQ, Q;
      if(Math.random() < 0.5){                                   // transfert
        Q = ids[Math.floor(Math.random() * ids.length)];
        if(Q === P || !dispo(Q, a1)) continue;
        retire(IV[P], a1[2], a1[3]); IV[Q].push([a1[2], a1[3]]);
        cP = coutP(P); cQ = coutP(Q); delta = cP + cQ - C[P] - C[Q];
        if(delta <= 0 || Math.random() < Math.exp(-delta / T)){
          C[P] = cP; C[Q] = cQ; cout += delta;
          delete occ[a1[0].id + "|" + P]; occ[a1[0].id + "|" + Q] = 1; a1[1] = Q;
        } else { retire(IV[Q], a1[2], a1[3]); IV[P].push([a1[2], a1[3]]); }
      } else {                                                   // échange
        var a2 = A[Math.floor(Math.random() * A.length)]; Q = a2[1];
        if(Q === P || a2[0] === a1[0]) continue;
        if(occ[a2[0].id + "|" + P] || a2[0].equipe.indexOf(P) > -1 || estResp(a2[0], P)) continue;
        if(occ[a1[0].id + "|" + Q] || a1[0].equipe.indexOf(Q) > -1 || estResp(a1[0], Q)) continue;
        retire(IV[P], a1[2], a1[3]); retire(IV[Q], a2[2], a2[3]);
        if(chevauche(IV[P], a2[2], a2[3]) || chevauche(chefs[P], a2[2], a2[3]) ||
           chevauche(IV[Q], a1[2], a1[3]) || chevauche(chefs[Q], a1[2], a1[3])){
          IV[P].push([a1[2], a1[3]]); IV[Q].push([a2[2], a2[3]]); continue;
        }
        IV[P].push([a2[2], a2[3]]); IV[Q].push([a1[2], a1[3]]);
        cP = coutP(P); cQ = coutP(Q); delta = cP + cQ - C[P] - C[Q];
        if(delta <= 0 || Math.random() < Math.exp(-delta / T)){
          C[P] = cP; C[Q] = cQ; cout += delta;
          delete occ[a1[0].id + "|" + P]; delete occ[a2[0].id + "|" + Q];
          occ[a1[0].id + "|" + Q] = 1; occ[a2[0].id + "|" + P] = 1;
          a1[1] = Q; a2[1] = P;
        } else {
          retire(IV[P], a2[2], a2[3]); retire(IV[Q], a1[2], a1[3]);
          IV[P].push([a1[2], a1[3]]); IV[Q].push([a2[2], a2[3]]);
        }
      }
      if(cout < meilleurCout - 1e-9){ meilleurCout = cout; meilleursProprios = A.map(function(a){ return a[1]; }); }
    }
    A.forEach(function(a, i){ a[1] = meilleursProprios[i]; });

    // bilan sur la solution retenue
    var fin = {}; ids.forEach(function(id){ fin[id] = base[id].slice(); });
    A.forEach(function(a){ fin[a[1]].push([a[2], a[3]]); });
    var nbCh = 0, chF = [];
    ids.forEach(function(id){ nbCh += nbChaines(fin[id]); chF.push(charge(fin[id])); });
    A.forEach(function(a){ a[0].equipe.push(a[1]); });
    return {places:slots.length, remplies:A.length, enchainements:nbCh,
            ecart:Math.max.apply(null, chF) - Math.min.apply(null, chF)};
  }

  function supprimerMembre(p){
    var rang = state.people.indexOf(p);
    if(rang === -1) return;
    var places = [], chefs = [], vivier = (state.respPool || []).indexOf(p.id);
    state.shifts.forEach(function(s){
      var i = s.equipe.indexOf(p.id);
      if(i > -1){ places.push({id:s.id, i:i}); s.equipe.splice(i,1); }
      var r = respsDe(s).indexOf(p.id);
      if(r > -1){ chefs.push({id:s.id, i:r}); s.resps.splice(r,1); }
    });
    if(vivier > -1) state.respPool.splice(vivier, 1);
    state.people.splice(rang, 1);
    sauver(); render();
    var nl = places.length + chefs.length;
    toast(p.nom + " n'est plus dans la liste" +
          (nl ? " · " + nl + " shift" + (nl>1 ? "s libérés" : " libéré") : ""),
      function(){
        if(state.people.some(function(x){ return x.id === p.id; })) return;
        state.people.splice(Math.min(rang, state.people.length), 0, p);
        places.forEach(function(pl){
          var s = shift(pl.id);
          if(s && s.equipe.indexOf(p.id) === -1) s.equipe.splice(Math.min(pl.i, s.equipe.length), 0, p.id);
        });
        chefs.forEach(function(pl){
          var s = shift(pl.id);
          if(s){ s.resps = respsDe(s).slice(); if(s.resps.indexOf(p.id) === -1) s.resps.splice(Math.min(pl.i, s.resps.length), 0, p.id); }
        });
        if(vivier > -1){ state.respPool = state.respPool || []; if(state.respPool.indexOf(p.id) === -1) state.respPool.splice(vivier, 0, p.id); }
        sauver(); render();
      });
  }

    pl2.value = state.plan.legende || "";
    pl2.addEventListener("input", function(){ state.plan.legende = pl2.value; sauver(); });
    pg.appendChild(pl2);
    var pv = el('<button class="mini">Voir le plan</button>');
    pv.addEventListener("click", function(){ go("plan"); });
    pg.appendChild(pv);
    rg.appendChild(pg);

    var dat = el('<div class="adm"><h3>Données</h3>' +
      '<p class="meta">Copie ce texte pour sauvegarder la configuration ou me la transmettre. ' +
      'Colle-en une autre puis « Charger » pour la remplacer.</p></div>');
    var ta = el('<textarea style="min-height:150px;font-family:ui-monospace,monospace;font-size:.78rem"></textarea>');
    ta.value = JSON.stringify(state, null, 1);
    var cp = el('<button class="mini">Tout sélectionner</button>');
    cp.addEventListener("click", function(){ ta.focus(); ta.select(); });
    var ld = el('<button class="mini">Charger ce contenu</button>');
    ld.addEventListener("click", function(){
      try{
        var s = JSON.parse(ta.value);
        if(!s.shifts || !s.people) throw new Error("structure");
        state = s; sauver(); alert("Configuration chargée."); go("admin");
      }catch(e){ alert("JSON invalide, rien n'a été chargé."); }
    });
    var rz = el('<button class="mini warn">Réinitialiser</button>');
    rz.addEventListener("click", function(){
      if(!confirm("Revenir aux données fictives de départ ?")) return;
      state = seedData(); sauver(); go("admin");
    });
    dat.appendChild(ta); dat.appendChild(cp); dat.appendChild(ld); dat.appendChild(rz);
    app.appendChild(dat);
  }

  /* ---------- démarrage ---------- */
  document.getElementById("topP").addEventListener("click", function(){
    if(vue.n === "plan") retour(); else go("plan");
  });
  document.getElementById("topU").addEventListener("click", function(){
    if(vue.n === "sos") retour(); else go("sos");
  });
  topA.addEventListener("click", function(){
    if(vue.n === "admin" || vue.n === "edit" || vue.n === "reglages"){ go(moi ? "me" : "pick"); return; }
    go(admin ? "admin" : "gate");
  });

  badge("", CONNECTE ? "CONNEXION…" : "LOCAL");
  state = charger();
  defauts();
  var m = memo("moi");
  if(m && pers(m)) moi = m;
  vue = {n: moi ? "me" : "pick"};
  render();

  // les pastilles « en cours » se mettent à jour toutes les minutes
  setInterval(function(){
    if(vue.n === "me" || vue.n === "planning" || vue.n === "fiche") render();
  }, 30000);
})();
</script>

<script type="module">
/* Couche de synchronisation temps réel.
   Sans config.js rempli, ce bloc ne fait rien et la page reste en mode local. */
const C = window.WEI_CONFIG || {};
const W = window.WEI;
if (C.firebase && C.firebase.apiKey && W) {
  const V = "12.19.0";
  try {
    const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const { getFirestore, doc, onSnapshot, setDoc } =
      await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);

    const db = getFirestore(initializeApp(C.firebase));
    const ref = doc(db, C.collection || "wei", C.document || "planning");
    let dernier = null;

    W.connect({
      push(state) {
        const json = JSON.stringify(state);
        if (json === dernier) return;
        dernier = json;
        setDoc(ref, { json, maj: Date.now() })
          .catch((e) => W.statut("ko", e && e.code ? e.code : "écriture refusée"));
      }
    });

    onSnapshot(ref, (snap) => {
      W.statut("ok");
      if (!snap.exists()) { W.seedRemote(); return; }   // premier chargement : on sème la config
      const d = snap.data();
      if (!d || typeof d.json !== "string" || d.json === dernier) return;
      dernier = d.json;
      W.receive(d.json);
    }, (e) => W.statut("ko", e && e.code ? e.code : ""));
  } catch (e) {
    W.statut("ko", "Firebase injoignable");
  }
}
</script>
