      var r = el('<div class="brow"></div>');
      var ni = el('<input aria-label="Numéro" placeholder="N°">'); ni.value = b.num;
      ni.addEventListener("change", function(){
        var neuf = ni.value.trim(), ancien = String(b.num);
        if(!neuf || neuf === ancien) { ni.value = ancien; return; }
        if(bgs.some(function(x){ return x !== b && String(x.num) === neuf; })){
          alert("Le bungalow " + neuf + " existe déjà."); ni.value = ancien; return;
        }
        var ec = etatCle(ancien);
        b.num = neuf; sauver();
        if(ec){ majCle(neuf, ec); majCle(ancien, null); }
        render();
      });
      var ri = el('<input aria-label="Responsable" placeholder="Responsable du bungalow">'); ri.value = b.resp || "";
      ri.addEventListener("input", function(){ b.resp = ri.value; sauver(); });
      var st = el('<span class="bst ' + (e ? e.etat : '') + '">' + (!e ? 'CLÉ ICI' : e.etat === "remise" ? 'REMISE' : 'RENDUE') + '</span>');
      var x = el('<button class="mx" aria-label="Supprimer le bungalow">✕</button>');
      x.addEventListener("click", function(){
        if(!confirm("Supprimer le bungalow " + b.num + " ?")) return;
        var i = bgs.indexOf(b); if(i > -1) bgs.splice(i, 1);
        if(etatCle(b.num)) majCle(b.num, null);
        sauver(); render();
      });
      r.appendChild(ni); r.appendChild(ri); r.appendChild(st); r.appendChild(x);
      lst.appendChild(r);
    });
    bb.appendChild(lst);
    var ab = el('<button class="mini">+ Ajouter un bungalow</button>');
    ab.addEventListener("click", function(){
      var n = 1; while(bgs.some(function(x){ return String(x.num) === "Nouveau " + n; })) n++;
      bgs.push({id:uid("b"), num:"Nouveau " + n, resp:""}); sauver(); render();
    });
    bb.appendChild(ab);
    if(nRem || nRen){
      var rz0 = el('<button class="mini warn">Remettre toutes les clés à zéro</button>');
      rz0.addEventListener("click", function(){
        if(!confirm("Effacer l'historique de toutes les clés (remises et rendues) ? À faire uniquement après des tests.")) return;
        if(CONNECTE){ if(remote) remote.resetCles(); state.cles = {}; }
        else { state.cles = {}; sauver(); }
        render();
      });
      bb.appendChild(rz0);
    }
    app.appendChild(bb);

    var dat = el('<div class="adm"><h3>Données</h3>' +
      '<p class="meta">Copie ce texte pour sauvegarder la configuration ou me la transmettre. ' +
      'Un bloc qui ne contient que des fiches de poste (<code>{"fiches": …}</code>) est ajouté ' +
      'sans rien effacer. ' +
      'Colle-en une autre puis « Charger » pour la remplacer.</p></div>');
    var ta = el('<textarea style="min-height:150px;font-family:ui-monospace,monospace;font-size:.78rem"></textarea>');
    ta.value = JSON.stringify(state, null, 1);
    var cp = el('<button class="mini">Tout sélectionner</button>');
    cp.addEventListener("click", function(){ ta.focus(); ta.select(); });
    var ld = el('<button class="mini">Charger ce contenu</button>');
    ld.addEventListener("click", function(){
      try{
        var s = JSON.parse(ta.value);
        if(s && s.fiches && !s.shifts && !s.people){
          // import partiel : les fiches sont fusionnées, rien d'autre ne bouge
          state.fiches = state.fiches || {};
          var noms = Object.keys(s.fiches), orphelines = [];
          noms.forEach(function(n){
            var f = s.fiches[n] || {};
            state.fiches[cle(n)] = {
              mission: String(f.mission || ""),
              taches: [].concat(f.taches || []).map(String),
              materiel: [].concat(f.materiel || []).map(String),
              referent: String(f.referent || "")
            };
            if(!state.shifts.some(function(x){ return cle(x.nom) === cle(n); })) orphelines.push(n);
          });
          sauver();
          alert(noms.length + " fiche" + (noms.length > 1 ? "s importées" : " importée") +
                (orphelines.length ? ".\n\nAucun shift ne porte ce nom : " + orphelines.join(", ") +
                 ". Vérifie l'orthographe du poste." : "."));
          go("admin");
          return;
        }
        if(!s.shifts || !s.people) throw new Error("structure");
        state = s; sauver(); alert("Configuration chargée."); go("admin");
      }catch(e){ alert("JSON invalide, rien n'a été chargé."); }
    });
    var rz = el('<button class="mini warn">Réinitialiser</button>');
    rz.addEventListener("click", function(){
      if(!confirm("Revenir aux données fictives de départ ?")) return;
      state = seedData(); sauver(); go("admin");
    });
    dat.appendChild(ta); dat.appendChild(cp); dat.appendChild(ld); dat.appendChild(rz);
    app.appendChild(dat);
  }

  /* ---------- démarrage ---------- */
  document.getElementById("topK").addEventListener("click", function(){
    if(vue.n === "cles") retour(); else go("cles");
  });
  document.getElementById("topP").addEventListener("click", function(){
    if(vue.n === "plan") retour(); else go("plan");
  });
  document.getElementById("topU").addEventListener("click", function(){
    if(vue.n === "sos") retour(); else go("sos");
  });
  topA.addEventListener("click", function(){
    if(vue.n === "admin" || vue.n === "edit" || vue.n === "reglages"){ go(moi ? "me" : "pick"); return; }
    go(admin ? "admin" : "gate");
  });

  badge("", CONNECTE ? "CONNEXION…" : "LOCAL");
  state = charger();
  defauts();
  var m = memo("moi");
  if(m && pers(m)) moi = m;
  vue = {n: moi ? "me" : "pick"};
  render();

  // les pastilles « en cours » se mettent à jour toutes les minutes
  setInterval(function(){
    if(vue.n === "me" || vue.n === "planning" || vue.n === "fiche") render();
  }, 30000);
})();
</script>

<script type="module">
/* Couche de synchronisation temps réel.
   Sans config.js rempli, ce bloc ne fait rien et la page reste en mode local. */
const C = window.WEI_CONFIG || {};
const W = window.WEI;
if (C.firebase && C.firebase.apiKey && W) {
  const V = "12.19.0";
  try {
    const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const { getFirestore, doc, onSnapshot, setDoc, updateDoc, FieldPath, deleteField } =
      await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);

    const db = getFirestore(initializeApp(C.firebase));
    const ref = doc(db, C.collection || "wei", C.document || "planning");
    let dernier = null;

    const erreur = (e) => W.statut("ko", e && e.code ? e.code : "écriture refusée");
    W.connect({
      // le planning : un seul champ JSON, sans les clés (elles ont leur propre champ)
      push(state) {
        const copie = Object.assign({}, state);
        delete copie.cles;
        const json = JSON.stringify(copie);
        if (json === dernier) return;
        dernier = json;
        setDoc(ref, { json, maj: Date.now() }, { merge: true }).catch(erreur);
      },
      // une clé = un sous-champ : deux remises simultanées ne s'écrasent pas
      pushCle(num, val) {
        const chemin = new FieldPath("cles", String(num));
        updateDoc(ref, chemin, val ? val : deleteField()).catch(erreur);
      },
      resetCles() {
        updateDoc(ref, { cles: {} }).catch(erreur);
      }
    });

    onSnapshot(ref, (snap) => {
      W.statut("ok");
      if (!snap.exists()) { W.seedRemote(); return; }   // premier chargement : on sème la config
      const d = snap.data();
      if (!d) return;
      if (typeof d.json === "string" && d.json !== dernier) {
        dernier = d.json;
        W.receive(d.json);
      }
      W.recevoirCles(d.cles || {});
    }, (e) => W.statut("ko", e && e.code ? e.code : ""));
  } catch (e) {
    W.statut("ko", "Firebase injoignable");
  }
}
</script>
